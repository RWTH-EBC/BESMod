# Dymola CI for BESMod on GitHub Actions.
# Replaces the GitLab CI that ran on the git.rwth-aachen.de mirror
# (.gitlab-ci.yml -> ci-tests/scripts/*.gitlab-ci.yml, generated by MoCITempGen).
#
# Requirements:
#   - A self-hosted Linux runner with Docker and the labels [self-hosted, linux, dymola]
#     that can reach the RWTH Dymola license server (license2.rz.rwth-aachen.de:50064).
#   - Access to the Dymola image, set as organization or repository settings:
#       vars.DYMOLA_IMAGE             image incl. tag (optional, default: GitLab image below)
#       vars.DYMOLA_REGISTRY_USER     registry user   (required)
#       secrets.DYMOLA_REGISTRY_TOKEN registry token  (required)
#     GitLab registry (transition): a deploy token of EBC/EBC_intern/dymola-docker with
#       scope read_registry; user = token name (gitlab+deploy-token-...), token = its value.
#     GHCR (target): replace both values in the credentials blocks with
#       ${{ github.actor }} / ${{ secrets.GITHUB_TOKEN }} and grant this repository read
#       access to the package ("Manage Actions access").
#     GitHub does not allow empty credentials, so both settings must exist.
#
# Commit keywords (as before on GitLab):
#   no "ci_" keyword      -> full pipeline (always on main)
#   ci_changed_only       -> only models changed in this commit/branch
#   ci_html / ci_style_check / ci_check / ci_simulate / ci_regression_test
#                         -> only the respective stage
#
# Intentionally push-only: the runner is self-hosted and BESMod is public, so
# workflows from fork pull requests must never run on it.

name: Modelica CI (Dymola)

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  LIBRARY: BESMod
  ALL_PACKAGES: Examples Tutorial Utilities Systems
  STARTUP_MOS: startup.mos
  MIN_FREE_LICENSES: "5"
  CHANGED_FLAG: ${{ contains(github.event.head_commit.message, 'ci_changed_only') && '--changed-flag' || '' }}

defaults:
  run:
    shell: bash

jobs:
  html_check:
    name: HTML check
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      || !contains(github.event.head_commit.message, 'ci_')
      || contains(github.event.head_commit.message, 'ci_changed_only')
      || contains(github.event.head_commit.message, 'ci_html')
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 60
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
        with:
          install-modelica-libraries: "false"
      - name: Check HTML documentation
        run: |
          python -m ModelicaPyCI.syntax.html_tidy --filter-whitelist-flag --correct-view-flag --log-flag \
            --whitelist-library IBPSA --library "$LIBRARY" --packages $ALL_PACKAGES
          if grep -q "Syntax Error" ci-tests/Configfiles/exit.sh 2>/dev/null; then
            echo "::error::HTML syntax errors found. See the ci-tests-result artifact."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: html-check-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  style_check:
    name: Style check
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
      || !contains(github.event.head_commit.message, 'ci_')
      || contains(github.event.head_commit.message, 'ci_changed_only')
      || contains(github.event.head_commit.message, 'ci_style_check')
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 120
    continue-on-error: true   # was allow_failure: true on GitLab
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
        with:
          install-modelica-libraries: "false"
      - name: Dymola style check
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.syntax.style_checking $CHANGED_FLAG \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: style-check-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  model_check:
    name: Check ${{ matrix.name }}
    needs: html_check
    if: >-
      !cancelled() && needs.html_check.result != 'failure' && (
        github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        || !contains(github.event.head_commit.message, 'ci_')
        || contains(github.event.head_commit.message, 'ci_changed_only')
        || contains(github.event.head_commit.message, 'ci_check'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Examples, packages: "Examples" }
          - { name: Systems,  packages: "Systems" }
          - { name: Other,    packages: "Tutorial Utilities" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Check models
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.validatetest --dym-options DYM_CHECK \
            --filter-whitelist-flag $CHANGED_FLAG --startup-mos "$STARTUP_MOS" \
            --min-number-of-unused-licences "$MIN_FREE_LICENSES" --additional-libraries-to-load \
            --packages ${{ matrix.packages }} --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-${{ matrix.name }}-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  simulate:
    name: Simulate ${{ matrix.name }}
    needs: model_check
    if: >-
      !cancelled() && needs.model_check.result != 'failure' && (
        github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        || !contains(github.event.head_commit.message, 'ci_')
        || contains(github.event.head_commit.message, 'ci_changed_only')
        || contains(github.event.head_commit.message, 'ci_simulate'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Examples, packages: "Examples" }
          - { name: Systems,  packages: "Systems" }
          - { name: Other,    packages: "Tutorial Utilities" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Simulate examples
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.validatetest --dym-options DYM_SIM \
            --filter-whitelist-flag $CHANGED_FLAG --startup-mos "$STARTUP_MOS" \
            --min-number-of-unused-licences "$MIN_FREE_LICENSES" --additional-libraries-to-load \
            --packages ${{ matrix.packages }} --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: simulate-${{ matrix.name }}-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  regression:
    name: Regression ${{ matrix.name }}
    needs: simulate
    if: >-
      !cancelled() && needs.simulate.result != 'failure' && (
        github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        || !contains(github.event.head_commit.message, 'ci_')
        || contains(github.event.head_commit.message, 'ci_changed_only')
        || contains(github.event.head_commit.message, 'ci_regression_test'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Examples, packages: "Examples" }
          - { name: Systems,  packages: "Systems" }
          - { name: Other,    packages: "Tutorial Utilities" }
          - { name: Coverage, packages: "Examples Tutorial Utilities Systems", coverage: true }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Regression test
        working-directory: ${{ env.LIBRARY }}
        env:
          MODE_FLAGS: ${{ matrix.coverage && '--coverage-only' || '--batch' }}
        run: |
          export CI_PYTHON_CONFIG_FILE="../ci-tests/config/modelica_py_ci_config.toml"
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.reference_check $MODE_FLAGS $CHANGED_FLAG \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" \
            --tool dymola --number-of-processors 4 --path . --library-root .. \
            --packages ${{ matrix.packages }} --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: regression-${{ matrix.name }}-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore
