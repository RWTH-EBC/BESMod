# Dymola CI for BESMod on GitHub Actions.
# Replaces the GitLab CI that ran on the git.rwth-aachen.de mirror
# (.gitlab-ci.yml -> ci-tests/scripts/*.gitlab-ci.yml, generated by MoCITempGen).
#
# Requirements:
#   - A self-hosted Linux runner with Docker and the labels [self-hosted, linux, dymola]
#     that can reach the RWTH Dymola license server (license2.rz.rwth-aachen.de:50064).
#   - Access to the Dymola image, set as organization or repository settings:
#       vars.DYMOLA_IMAGE             image incl. tag (optional, default: GitLab image below)
#       vars.DYMOLA_REGISTRY_USER     registry user   (required)
#       secrets.DYMOLA_REGISTRY_TOKEN registry token  (required)
#     GitLab registry (transition): a deploy token of EBC/EBC_intern/dymola-docker with
#       scope read_registry; user = token name (gitlab+deploy-token-...), token = its value.
#     GHCR (target): replace both values in the credentials blocks with
#       ${{ github.actor }} / ${{ secrets.GITHUB_TOKEN }} and grant this repository read
#       access to the package ("Manage Actions access").
#     GitHub does not allow empty credentials, so both settings must exist.
#   - Settings -> Actions -> General -> Workflow permissions:
#     "Allow GitHub Actions to create and approve pull requests" (HTML correction PRs).
#   - GitHub Pages served from the branch gh-pages, folder /docs. Results of a branch are
#     published to https://rwth-ebc.github.io/BESMod/<branch>/ (kept while the branch has
#     an open pull request, otherwise removed after 14 days without commits).
#
# Commit keywords (as before on GitLab):
#   no "ci_" keyword            -> full pipeline (always on the default branch)
#   ci_changed_only             -> full pipeline, only models changed in this branch
#   ci_reference_check / ci_html / ci_style_check / ci_check_naming / ci_check /
#   ci_simulate / ci_regression_test
#                               -> only the respective stage
#   ci_create_model_whitelist / ci_create_example_whitelist
#                               -> create and push the check / simulate whitelist
#
# Manual runs: Actions -> "Modelica CI (Dymola)" -> "Run workflow"; the keywords above
# can be entered in the field ci_keywords (empty: full pipeline). GitHub only offers
# "Run workflow" (and the automatic restart after new reference results) once this
# file exists on the default branch.
# Note: the whole commit message is searched, so do not mention keywords in the
# description of a commit. Commits without changed files (e.g. --allow-empty) do not
# start the workflow because of the paths-ignore filter.
#
# Automatic actions of the CI (pushed with GITHUB_TOKEN as github-actions[bot]):
#   - missing reference results are created, pushed to the branch and plotted; the
#     pipeline then restarts on the new commit
#   - HTML errors are corrected on the branch correct_HTML_<branch> with a pull request
#   - failed regression tests are plotted
#   - results are published on GitHub Pages (kept as long as the branch has an open pull
#     request, otherwise removed 14 days after the last commit)
#   - one CI summary comment per pull request, posted again at the end of the pull request
#     on every run (the previous one is deleted): stage results, failed regression tests
#     and changed reference results (deviations compared to the default branch, plots
#     main vs. branch), with links to the plots
#   - runs started with "Run workflow" or by the restart above are not shown in the checks
#     of a pull request by GitHub; they set the commit status "Modelica CI (Dymola) / restarted
#     run" (pending -> success / failure / error) on their commit instead
#   - an open pull request gets an initial comment with the contribution guidelines
#
# Intentionally push-only: the runner is self-hosted and BESMod is public, so
# workflows from fork pull requests must never run on it.

name: Modelica CI (Dymola)

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      ci_keywords:
        description: >-
          Commit keywords to run only some stages, e.g. "ci_check ci_simulate".
          Empty: full pipeline.
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  LIBRARY: BESMod
  ALL_PACKAGES: Examples Tutorial Utilities Systems
  STARTUP_MOS: startup.mos
  MIN_FREE_LICENSES: "5"
  MAIN_BRANCH: ${{ github.event.repository.default_branch }}   # main or master, taken from the repository settings
  PAGE_URL: https://rwth-ebc.github.io/BESMod
  TEMPLATES_URL: https://github.com/RWTH-EBC/MoCITempGen.git@03_openModelica
  CHANGED_FLAG: ${{ contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only') && '--changed-flag' || '' }}

defaults:
  run:
    shell: bash

jobs:
  dispatch_status_start:
    # GitHub does not link workflow_dispatch runs to the pull request; a commit status does.
    name: Report restarted run (start)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set commit status to pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context="Modelica CI (Dymola) / restarted run" \
            -f description="Running (started by ${GITHUB_ACTOR})" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null \
            || echo "::warning::Could not set the commit status."

  reference_check:
    name: Reference results
    if: >-
      github.ref_name == github.event.repository.default_branch
      || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
      || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
      || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_reference_check')
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    permissions:
      contents: write
      packages: read
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Create missing reference results
        id: refs
        working-directory: ${{ env.LIBRARY }}
        run: |
          # TODO: Remove custom version once merged to buildingspy (as on GitLab)
          pip uninstall buildingspy -y && pip install git+https://github.com/FWuellhorst/BuildingsPy@issue558
          command -v xdg-open >/dev/null || { apt-get update && apt-get install -y --no-install-recommends xdg-utils; }
          export CI_PYTHON_CONFIG_FILE="../ci-tests/config/modelica_py_ci_config.toml"
          set +e
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.reference_check --create-ref \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" \
            --tool dymola --number-of-processors 4 --path . --library-root .. \
            --packages $ALL_PACKAGES --library "$LIBRARY"
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
      - name: Push and plot new reference results
        id: push
        # The pull request comment with the link is posted by the publish job,
        # once the plots are on GitHub Pages.
        run: |
          if ! grep -q "GENERATED_NEW_RESULTS" ci-tests/Configfiles/exit.sh 2>/dev/null; then
            echo "No new reference results."
            exit 0
          fi
          files_to_push=$(git ls-files --others --exclude-standard "$LIBRARY")
          if [ -z "$files_to_push" ]; then
            echo "::warning::GENERATED_NEW_RESULTS reported, but no new files found."
            exit 0
          fi
          echo $files_to_push > ci-tests/Configfiles/ci_new_created_reference.txt
          python -m ModelicaPyCI.converter.google_charts --new-ref-flag --templates-url "$TEMPLATES_URL" \
            --library "$LIBRARY" --packages $ALL_PACKAGES \
            || echo "::warning::Could not plot the new reference results."
          git add $files_to_push
          git commit -m "CI message from github-actions. Automatic push of CI with new regression reference files. Please pull the new files before push again. Plotted results: $PAGE_URL/$GITHUB_REF_NAME/charts/"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Stop this run
        if: steps.push.outputs.pushed == 'true' || steps.refs.outputs.exit-code != '0'
        run: |
          if [ "${{ steps.push.outputs.pushed }}" == "true" ]; then
            echo "::error::New reference results were pushed to $GITHUB_REF_NAME. The CI restarts on that commit after the results are published; pull the branch before you push again."
          else
            echo "::error::Creating the reference results failed (exit code ${{ steps.refs.outputs.exit-code }})."
          fi
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reference-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  html_check:
    name: HTML check
    needs: reference_check
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && (
        github.ref_name == github.event.repository.default_branch
        || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_html'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      packages: read
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
        with:
          install-modelica-libraries: "false"
      - name: Check HTML documentation
        id: html
        run: |
          python -m ModelicaPyCI.syntax.html_tidy --filter-whitelist-flag --correct-view-flag --log-flag \
            --whitelist-library IBPSA --library "$LIBRARY" --packages $ALL_PACKAGES
          if grep -q "Syntax Error" ci-tests/Configfiles/exit.sh 2>/dev/null; then
            echo "::error::HTML syntax errors found. See the html-check-result artifact."
            exit 1
          fi
      - name: Open pull request with corrected HTML
        if: failure() && steps.html.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="correct_HTML_"
          if [[ "$GITHUB_REF_NAME" == ${PREFIX}* ]]; then
            echo "::error::Branch is already used to fix HTML, no further correction."
            exit 1
          fi
          python -m ModelicaPyCI.syntax.html_tidy --filter-whitelist-flag --log-flag --correct-overwrite-flag \
            --whitelist-library IBPSA --library "$LIBRARY" --packages $ALL_PACKAGES
          NEW_BRANCH="${PREFIX}${GITHUB_REF_NAME}"
          git checkout -B "$NEW_BRANCH"
          git add "$LIBRARY"
          if git diff --cached --quiet; then
            echo "::warning::The HTML correction did not change any file."
            exit 0
          fi
          git commit -m "CI message from github-actions. Push new files with corrected html Syntax ."
          git push --force origin "HEAD:refs/heads/$NEW_BRANCH"
          python -m ModelicaPyCI.api_script.api_github --correct-html-flag --create-pr-flag \
            --github-token "$GH_TOKEN" --main-branch "$GITHUB_REF_NAME" --working-branch "$NEW_BRANCH" \
            --library "$LIBRARY" --github-repository "$GITHUB_REPOSITORY"
          echo "::notice::Corrected HTML pushed to $NEW_BRANCH, see the pull request into $GITHUB_REF_NAME."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: html-check-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  style_check:
    name: Style check
    needs: reference_check
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && (
        github.ref_name == github.event.repository.default_branch
        || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_style_check'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 120
    continue-on-error: true   # was allow_failure: true on GitLab
    outputs:
      # needs.style_check.result is "success" because of continue-on-error
      outcome: ${{ steps.style.outcome }}
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Needs startup.mos (written by install_dependencies.py) to load BESMod with its libraries
      - uses: ./.github/actions/setup-modelica-ci
      - name: Dymola style check
        id: style
        # Default branch: whole library. Other branches: only models changed compared to it
        # (whole library if more than 100 models changed).
        run: |
          SCOPE_FLAGS=""
          if [ "$GITHUB_REF" != "refs/heads/$MAIN_BRANCH" ]; then
            if python -m ModelicaPyCI.syntax.style_checking --help | grep -q -- "--main-branch"; then
              SCOPE_FLAGS="--changed-flag --main-branch $MAIN_BRANCH"
            else
              # older ModelicaPyCI: compares with the last two commits only
              SCOPE_FLAGS="--changed-flag"
            fi
          fi
          echo "Style check scope: ${SCOPE_FLAGS:-whole library}"
          xvfb-run -n 77 python -m ModelicaPyCI.syntax.style_checking $SCOPE_FLAGS \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: style-check-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  naming_guideline:
    name: Naming guideline
    # Only reports violations in changed files (artifact), never fails - as on GitLab.
    if: >-
      github.ref_name == github.event.repository.default_branch
      || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
      || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
      || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_check_naming')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # 3.9 (as in the Dymola image) is not available on ubuntu-latest anymore
      - name: Install Python CI tooling
        run: |
          python -m pip install --upgrade pip
          pip install natsort toml pandas mako requests openpyxl
          pip install git+https://github.com/FWuellhorst/BuildingsPy.git@issue253_coverage
          pip install git+https://github.com/RWTH-EBC/ModelicaPyCI.git
      - name: Check naming guideline of changed files
        env:
          CI_PYTHON_CONFIG_FILE: ci-tests/config/modelica_py_ci_config.toml
        run: |
          python -m ModelicaPyCI.syntax.naming_guideline --changed-flag --main-branch "$MAIN_BRANCH" \
            --config ci-tests/naming_guideline.toml --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: naming-guideline-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  model_check:
    name: Check ${{ matrix.name }}
    needs: [reference_check, html_check]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && (
        github.ref_name == github.event.repository.default_branch
        || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_check'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Examples, packages: "Examples" }
          - { name: Systems,  packages: "Systems" }
          - { name: Other,    packages: "Tutorial Utilities" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Check models
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.validatetest --dym-options DYM_CHECK \
            --filter-whitelist-flag $CHANGED_FLAG --startup-mos "$STARTUP_MOS" \
            --min-number-of-unused-licences "$MIN_FREE_LICENSES" --additional-libraries-to-load \
            --packages ${{ matrix.packages }} --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-${{ matrix.name }}-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  simulate:
    name: Simulate ${{ matrix.name }}
    needs: [reference_check, html_check, model_check]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && (
        github.ref_name == github.event.repository.default_branch
        || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_simulate'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Examples, packages: "Examples" }
          - { name: Systems,  packages: "Systems" }
          - { name: Other,    packages: "Tutorial Utilities" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Simulate examples
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.validatetest --dym-options DYM_SIM \
            --filter-whitelist-flag $CHANGED_FLAG --startup-mos "$STARTUP_MOS" \
            --min-number-of-unused-licences "$MIN_FREE_LICENSES" --additional-libraries-to-load \
            --packages ${{ matrix.packages }} --library "$LIBRARY"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: simulate-${{ matrix.name }}-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  regression:
    name: Regression ${{ matrix.name }}
    needs: [reference_check, html_check, model_check, simulate]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') && (
        github.ref_name == github.event.repository.default_branch
        || !contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_changed_only')
        || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_regression_test'))
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Examples, packages: "Examples" }
          - { name: Systems,  packages: "Systems" }
          - { name: Other,    packages: "Tutorial Utilities" }
          - { name: Coverage, packages: "Examples Tutorial Utilities Systems", coverage: true }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Regression test
        id: regression
        working-directory: ${{ env.LIBRARY }}
        env:
          MODE_FLAGS: ${{ matrix.coverage && '--coverage-only' || '--batch' }}
        run: |
          export CI_PYTHON_CONFIG_FILE="../ci-tests/config/modelica_py_ci_config.toml"
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.reference_check $MODE_FLAGS $CHANGED_FLAG \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" \
            --tool dymola --number-of-processors 4 --path . --library-root .. \
            --packages ${{ matrix.packages }} --library "$LIBRARY"
      - name: Plot failed regression results
        # The pull request comment with the link is posted by the publish job,
        # once the plots are on GitHub Pages.
        if: failure() && steps.regression.outcome == 'failure' && !matrix.coverage
        run: |
          if ! grep -q "FAIL" ci-tests/Configfiles/exit.sh 2>/dev/null; then
            exit 0
          fi
          python -m ModelicaPyCI.converter.google_charts --funnel-comp-flag --error-flag \
            --templates-url "$TEMPLATES_URL" --library "$LIBRARY" --packages ${{ matrix.packages }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: regression-${{ matrix.name }}-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  whitelists:
    name: Create whitelists
    if: >-
      contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_create_model_whitelist')
      || contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_create_example_whitelist')
    runs-on: [self-hosted, linux, dymola]
    timeout-minutes: 420
    permissions:
      contents: write
      packages: read
    container:
      image: ${{ vars.DYMOLA_IMAGE || 'registry.git.rwth-aachen.de/ebc/ebc_intern/dymola-docker:Dymola2024xRefresh1-micromamba' }}
      credentials:
        username: ${{ vars.DYMOLA_REGISTRY_USER }}
        password: ${{ secrets.DYMOLA_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-modelica-ci
      - name: Create check whitelist
        if: contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_create_model_whitelist')
        continue-on-error: true
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.validatetest --dym-options DYM_CHECK --create-whitelist-flag \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" \
            --additional-libraries-to-load --packages $ALL_PACKAGES --library "$LIBRARY"
      - name: Create simulate whitelist
        if: contains((github.event.head_commit.message || inputs.ci_keywords), 'ci_create_example_whitelist')
        continue-on-error: true
        run: |
          xvfb-run -n 77 python -m ModelicaPyCI.unittest.validatetest --dym-options DYM_SIM --create-whitelist-flag \
            --startup-mos "$STARTUP_MOS" --min-number-of-unused-licences "$MIN_FREE_LICENSES" \
            --additional-libraries-to-load --packages $ALL_PACKAGES --library "$LIBRARY"
      - name: Push whitelists
        run: |
          git add ci-tests/whitelist
          if git diff --cached --quiet; then
            echo "Whitelists unchanged."
            exit 0
          fi
          git commit -m "CI message from github-actions. Update or created new whitelist. Please pull the new whitelist before push again."
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "::notice::Whitelists pushed to $GITHUB_REF_NAME, pull the branch before you push again."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: whitelist-result
          path: ci-tests/result/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    name: Publish results
    needs: [reference_check, html_check, style_check, naming_guideline, model_check, simulate, regression, whitelists]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      # one deployment to the gh-pages branch at a time, across all branches
      group: modelica-ci-gh-pages
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PYTHON_CONFIG_FILE: ci-tests/config/modelica_py_ci_config.toml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # compare reference results with the default branch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # 3.9 (as in the Dymola image) is not available on ubuntu-latest anymore
      - name: Install Python CI tooling
        run: |
          python -m pip install --upgrade pip
          pip install natsort toml pandas mako requests
          pip install git+https://github.com/FWuellhorst/BuildingsPy.git@issue253_coverage
          pip install git+https://github.com/RWTH-EBC/ModelicaPyCI.git
      - name: Post contribution guidelines to the pull request
        run: |
          python -m ModelicaPyCI.api_script.api_github --post-initial-pr-comment \
            --page "$PAGE_URL" --github-token "$GH_TOKEN" --main-branch "$MAIN_BRANCH" \
            --working-branch "$GITHUB_REF_NAME" --library "$LIBRARY" --github-repository "$GITHUB_REPOSITORY" \
            || echo "::warning::Could not post the initial pull request comment."
      - name: Collect results of all jobs
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: "*-result"
          merge-multiple: true
          path: ci-tests/result
      - name: Summarise reference changes and regression errors
        if: github.ref_name != github.event.repository.default_branch
        run: |
          if ! python -c "import ModelicaPyCI.converter.compare_reference_results" 2>/dev/null; then
            echo "::warning::This ModelicaPyCI version has no compare_reference_results, no summary."
            exit 0
          fi
          python -m ModelicaPyCI.converter.compare_reference_results --library "$LIBRARY" \
            --main-branch "$MAIN_BRANCH" --page-url "$PAGE_URL/$GITHUB_REF_NAME" \
            --summary-file "$RUNNER_TEMP/ci_summary.md" --reference-changes-flag --regression-errors-flag \
            || echo "::warning::Could not summarise the reference results."
      - name: Create index of the results
        run: |
          if [ -d ci-tests/result ] && [ -n "$(ls -A ci-tests/result)" ]; then
            python -m ModelicaPyCI.deploy.create_central_index_html
          else
            echo "No results in this run."
          fi
      - name: Deploy results to GitHub Pages
        run: |
          PAGES_DIR="$RUNNER_TEMP/gh-pages"
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$REPO_URL" "$PAGES_DIR"
          else
            mkdir -p "$PAGES_DIR/docs"
            git -C "$PAGES_DIR" init -b gh-pages
            git -C "$PAGES_DIR" remote add origin "$REPO_URL"
            touch "$PAGES_DIR/docs/.nojekyll"
            echo "<meta http-equiv=\"refresh\" content=\"0; url=$PAGE_URL/$MAIN_BRANCH/index.html\">" > "$PAGES_DIR/docs/index.html"
          fi
          cd "$PAGES_DIR"
          mkdir -p docs
          # Replace the results of this branch (no results -> folder removed)
          rm -rf "docs/$GITHUB_REF_NAME"
          if [ -d "$GITHUB_WORKSPACE/ci-tests/result" ] && [ -n "$(ls -A "$GITHUB_WORKSPACE/ci-tests/result")" ]; then
            mkdir -p "docs/$GITHUB_REF_NAME"
            cp -r "$GITHUB_WORKSPACE/ci-tests/result/." "docs/$GITHUB_REF_NAME/"
          fi
          # Remove results of branches without an open pull request and without commits for 14 days
          for folder in docs/*/; do
            name="$(basename "$folder")"
            case "$name" in main|master|development|"$MAIN_BRANCH") continue ;; esac
            open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$name" --state open --json number --jq length 2>/dev/null || echo 0)"
            if [ "$open_prs" != "0" ]; then
              echo "Keeping results of $name (open pull request)"
              continue
            fi
            last_commit="$(gh api "repos/$GITHUB_REPOSITORY/branches/$name" --jq '.commit.commit.committer.date' 2>/dev/null)" || continue
            age_days=$(( ( $(date +%s) - $(date -d "$last_commit" +%s) ) / 86400 ))
            if [ "$age_days" -ge 14 ]; then
              echo "Removing results of $name (no commits for $age_days days)"
              rm -rf "$folder"
            fi
          done
          git add -A
          if git diff --cached --quiet; then
            echo "GitHub Pages unchanged."
            exit 0
          fi
          git commit -q -m "Update CI results of $GITHUB_REF_NAME and remove old branches"
          for attempt in 1 2 3; do
            if git push origin HEAD:gh-pages; then
              echo "::notice::Results published: $PAGE_URL/$GITHUB_REF_NAME/index.html"
              exit 0
            fi
            git pull --rebase origin gh-pages
          done
          exit 1
      - name: Update the CI summary in the pull request
        # One comment per pull request: the previous summary is deleted and the new one is
        # posted at the end of the pull request, so it is visible and notifies. It keeps the
        # numbers of changed reference results and failed regression tests, even when the
        # plots are no longer published.
        if: github.ref_name != github.event.repository.default_branch
        env:
          REFERENCES_PUSHED: ${{ needs.reference_check.outputs.pushed }}
          R_REFERENCES: ${{ needs.reference_check.result }}
          R_HTML: ${{ needs.html_check.result }}
          R_CHECK: ${{ needs.model_check.result }}
          R_SIMULATE: ${{ needs.simulate.result }}
          R_REGRESSION: ${{ needs.regression.result }}
          R_STYLE: ${{ needs.style_check.outputs.outcome || needs.style_check.result }}
        run: |
          PR="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            echo "No open pull request for $GITHUB_REF_NAME."
            exit 0
          fi
          MARKER="<!-- modelica-ci-summary -->"
          symbol() {
            case "$1" in
              success) echo "✅" ;; failure) echo "❌" ;; cancelled) echo "⚪" ;; *) echo "⏭️" ;;
            esac
          }
          RESULTS="Reference results $(symbol "$R_REFERENCES") · HTML $(symbol "$R_HTML") · Check $(symbol "$R_CHECK")"
          RESULTS="$RESULTS · Simulate $(symbol "$R_SIMULATE") · Regression $(symbol "$R_REGRESSION") · Style $(symbol "$R_STYLE")"
          SUMMARY="$RUNNER_TEMP/ci_summary.md"
          BODY="$RUNNER_TEMP/ci_comment.md"
          {
            echo "$MARKER"
            echo "## Modelica CI results for \`${GITHUB_SHA::8}\`"
            echo "$RESULTS"
            echo ""
            echo "<sub>✅ passed · ❌ failed · ⏭️ not run in this run · ⚪ cancelled</sub>"
            echo ""
            if [ "$REFERENCES_PUSHED" == "true" ]; then
              echo "New reference results were created and pushed to the branch, the CI restarts on that commit."
              echo "Plots of the new reference results: $PAGE_URL/$GITHUB_REF_NAME/charts/index.html"
              echo ""
            fi
            if [ -s "$SUMMARY" ]; then
              cat "$SUMMARY"
            else
              echo "No failed regression tests and no changed reference results in this run."
            fi
            echo ""
            echo "All results: $PAGE_URL/$GITHUB_REF_NAME/index.html · [Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } > "$BODY"
          # GitHub Pages needs a moment after the push to gh-pages: wait up to 5 min for the results
          if [ -d ci-tests/result ] && [ -n "$(ls -A ci-tests/result)" ]; then
            for attempt in $(seq 1 30); do
              curl -sfo /dev/null "$PAGE_URL/$GITHUB_REF_NAME/index.html" && break
              sleep 10
            done
          fi
          OLD_IDS="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id")"
          # Post a summary when there is something to report or an earlier summary would
          # otherwise show outdated results
          if [ -z "$OLD_IDS" ] && [ ! -s "$SUMMARY" ] && [ "$REFERENCES_PUSHED" != "true" ]; then
            echo "Nothing to report, no comment created."
            exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
          for id in $OLD_IDS; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              || echo "::warning::Could not delete the previous summary comment $id."
          done
      - name: Restart the CI on the commit with the new reference results
        if: needs.reference_check.outputs.pushed == 'true'
        # Pushes with GITHUB_TOKEN do not start workflows, workflow_dispatch does.
        run: gh workflow run modelica-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

  dispatch_status:
    name: Report restarted run (result)
    needs: [dispatch_status_start, reference_check, html_check, style_check, naming_guideline, model_check, simulate, regression, whitelists, publish]
    # always(): also report cancelled runs, otherwise the status would stay pending
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Set final commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          FAILED="$(jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(", ")' <<< "$RESULTS")"
          CANCELLED="$(jq -r 'to_entries | map(select(.value.result == "cancelled") | .key) | join(", ")' <<< "$RESULTS")"
          if [ -n "$FAILED" ]; then
            STATE=failure; DESCRIPTION="Failed: $FAILED"
          elif [ -n "$CANCELLED" ]; then
            STATE=error; DESCRIPTION="Cancelled: $CANCELLED"
          else
            STATE=success; DESCRIPTION="All stages passed"
          fi
          # GitHub allows at most 140 characters
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="Modelica CI (Dymola) / restarted run" \
            -f description="${DESCRIPTION:0:140}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
